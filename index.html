<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Wi-Fi ポートチェッカー</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .port { font-size: 3rem; color: #007bff; font-weight: bold; margin: 20px 0; }
        p { color: #666; }
    </style>
</head>
<body>

    <div class="card">
        <h1>現在の通信ポート情報</h1>
        <p>あなたのWi-Fi・ブラウザが通信しているポート番号は：</p>
        <!-- アクセスした瞬間にここにポート番号が表示されます -->
        <div class="port" id="port-display">取得中...</div>
        <p id="details"></p>
    </div>

    <script>
        // 1. URLに明示的なポートがあるか確認（例: localhost:3000 など）
        let port = window.location.port;

        const display = document.getElementById('port-display');
        const details = document.getElementById('details');

        // 2. GitHub Pages等でポートが省略されている場合、プロトコルから標準ポートを判定
        if (!port) {
            const protocol = window.location.protocol;
            if (protocol === 'https:') {
                port = '443';
                details.textContent = '※GitHub Pagesとの通信は セキュリティで保護された HTTPS（ポート443）が使用されています。';
            } else {
                port = '80';
                details.textContent = '※通常の HTTP（ポート80）通信です。';
            }
        } else {
            details.textContent = '※指定されたカスタムポートで通信しています。';
        }

        // アクセスした瞬間に画面を書き換え
        display.textContent = port;
    </script>
</body>
</html>
