<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GitHub対応：IPアドレス・通信情報確認</title>
    <style>
        body { font-family: sans-serif; margin: 20px; line-height: 1.6; }
        h1 { color: #333; border-bottom: 2px solid #ccc; padding-bottom: 5px; }
        h2 { color: #555; background: #f4f4f4; padding: 5px 10px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #e9e9e9; width: 30%; }
    </style>
</head>
<body>

    <h1>GitHub Pagesで動く接続情報確認</h1>

    <h2>あなたの通信情報（外部API ＋ JavaScriptで取得）</h2>
    <table>
        <tr>
            <th>あなたのIPアドレス</th>
            <td id="info-ip">読み込み中...</td>
        </tr>
        <tr>
            <th>プロバイダ / 組織名</th>
            <td id="info-org">読み込み中...</td>
        </tr>
        <tr>
            <th>おおよその位置（国/都市）</th>
            <td id="info-geo">読み込み中...</td>
        </tr>
        <tr>
            <th>OS/ブラウザ情報 (User Agent)</th>
            <td id="info-ua">読み込み中...</td>
        </tr>
    </table>

    <h2>あなたのパソコンなどの情報（JavaScriptで取得）</h2>
    <table>
        <tr>
            <th>モニタサイズ</th>
            <td id="js-screen-size">確認中...</td>
        </tr>
        <tr>
            <th>ブラウザの言語環境</th>
            <td id="js-language">確認中...</td>
        </tr>
        <tr>
            <th>パソコンの日時</th>
            <td id="js-date">確認中...</td>
        </tr>
    </table>

    <script>
        // 1. 外部APIを使ってIPアドレス情報を取得する（GitHubで動かすための工夫）
        // ※公開されている無料の ipapi.co サービスを利用しています
        fetch('https://ipapi.co')
            .then(response => response.json())
            .then(data => {
                document.getElementById('info-ip').textContent = data.ip || '取得失敗';
                document.getElementById('info-org').textContent = data.org || '取得失敗';
                document.getElementById('info-geo').textContent = `${data.country_name} / ${data.city}` || '取得失敗';
            })
            .catch(error => {
                document.getElementById('info-ip').textContent = 'エラーが発生しました';
                console.error(error);
            });

        // 2. ブラウザのUser Agentを取得
        document.getElementById('info-ua').textContent = navigator.userAgent;

        // 3. 画面の横幅と縦幅を取得
        const width = window.screen.width;
        const height = window.screen.height;
        document.getElementById('js-screen-size').textContent = width + ' x ' + height;

        // 4. ブラウザの言語設定を取得
        document.getElementById('js-language').textContent = navigator.language;

        // 5. パソコンの現在時刻を取得
        const now = new Date();
        document.getElementById('js-date').textContent = now.toLocaleString();
    </script>

</body>
</html>
