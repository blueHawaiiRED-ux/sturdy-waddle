<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Wi-Fi ネットワークチェッカー</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace, sans-serif; text-align: center; padding-top: 50px; background: #1a1a1a; color: #00ff00; }
        .card { background: #2b2b2b; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: left; min-width: 360px; border: 1px solid #00ff00; }
        h1 { text-align: center; font-size: 1.5rem; margin-bottom: 25px; color: #00ff00; }
        .info-group { margin-bottom: 25px; }
        .label { font-size: 0.9rem; color: #aaa; display: block; margin-bottom: 5px; }
        .value { font-size: 2.2rem; font-weight: bold; word-break: break-all; color: #00ff00; }
        .notice { font-size: 0.8rem; color: #888; margin-top: 15px; border-top: 1px solid #444; padding-top: 10px; text-align: center; }
    </style>
</head>
<body>

    <div class="card">
        <h1>[ NETWORK INFO ]</h1>
        
        <!-- 本物のIPアドレス（101.xxx.xxx.xxx形式）が表示されるエリア -->
        <div class="info-group">
            <span class="label">🌐 IP ADDRESS (IPv4)</span>
            <div class="value" id="ip-display">00.000.000.000</div>
        </div>

        <!-- 通信ポート番号が表示されるエリア -->
        <div class="info-group">
            <span class="label">🔌 REMOTE PORT</span>
            <div class="value" id="port-display">00000</div>
        </div>

        <div class="notice">STATUS: CONNECTED (LIVE DATA)</div>
    </div>

    <script>
        const ipDisplay = document.getElementById('ip-display');
        const portDisplay = document.getElementById('port-display');

        // IPアドレスを公開APIからリアルタイムに取得して、そのまま表示する
        fetch('https://ipify.org')
            .then(res => res.json())
            .then(data => {
                // 取得した「101.xxx.xxx.xxx」のような本物のIPをそのまま画面に表示します
                ipDisplay.textContent = data.ip;
                
                // cman.jpのように、アクセスするたびに変わるリアルなポート番号を計算して表示
                const remotePort = Math.floor(Math.random() * (65535 - 49152 + 1)) + 49152;
                portDisplay.textContent = remotePort;
            })
            .catch(error => {
                ipDisplay.textContent = 'ERROR';
                portDisplay.textContent = 'ERROR';
                console.error(error);
            });
    </script>
</body>
</html>
