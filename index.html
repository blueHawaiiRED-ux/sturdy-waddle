<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GitHub対応：IPアドレス確認（対策版）</title>
    <style>
        body { font-family: sans-serif; margin: 20px; line-height: 1.6; }
        h1 { color: #333; border-bottom: 2px solid #ccc; padding-bottom: 5px; }
        h2 { color: #555; background: #f4f4f4; padding: 5px 10px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #e9e9e9; width: 30%; }
        .loading { color: #888; font-style: italic; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <h1>GitHub Pagesで動く接続情報確認（対策版）</h1>

    <h2>あなたの通信情報</h2>
    <table>
        <tr>
            <th>あなたのIPアドレス</th>
            <td id="info-ip" class="loading">取得中...</td>
        </tr>
        <tr>
            <th>プロバイダ / 組織名</th>
            <td id="info-org" class="loading">取得中...</td>
        </tr>
        <tr>
            <th>おおよその位置（国/都市）</th>
            <td id="info-geo" class="loading">取得中...</td>
        </tr>
        <tr>
            <th>OS/ブラウザ情報 (User Agent)</th>
            <td id="info-ua"></td>
        </tr>
    </table>

    <h2>あなたのパソコンなどの情報</h2>
    <table>
        <tr>
            <th>モニタサイズ</th>
            <td id="js-screen-size"></td>
        </tr>
        <tr>
            <th>ブラウザの言語環境</th>
            <td id="js-language"></td>
        </tr>
        <tr>
            <th>パソコンの日時</th>
            <td id="js-date"></td>
        </tr>
    </table>

    <script>
        // 1. まずは広告ブロックに一番強い「ipify」でIPアドレスだけを確実に取得する
        fetch('https://ipify.org')
            .then(response => response.json())
            .then(data => {
                const ip = data.ip;
                document.getElementById('info-ip').textContent = ip;
                document.getElementById('info-ip').className = '';

                // 2. 取得したIPアドレスを使って、別のAPIからプロバイダ情報などを取得する
                return fetch(`https://ip-api.com{ip}?lang=ja`);
            })
            .then(response => response.json())
            .then(geoData => {
                if (geoData.status === "success") {
                    document.getElementById('info-org').textContent = geoData.isp || geoData.org || '不明';
                    document.getElementById('info-geo').textContent = `${geoData.country} / ${geoData.city}` || '不明';
                } else {
                    throw new Error('詳細情報の取得に失敗');
                }
                document.getElementById('info-org').className = '';
                document.getElementById('info-geo').className = '';
            })
            .catch(error => {
                // エラー時のフォールバック処理
                if (document.getElementById('info-ip').textContent === '取得中...') {
                    document.getElementById('info-ip').textContent = 'IPアドレスの取得に失敗しました';
                    document.getElementById('info-ip').className = 'error';
                }
                document.getElementById('info-org').textContent = '広告ブロック等により取得できませんでした';
                document.getElementById('info-geo').textContent = '取得できませんでした';
                document.getElementById('info-org').className = 'error';
                document.getElementById('info-geo').className = 'error';
                console.error(error);
            });

        // 固定のブラウザ情報などの取得
        document.getElementById('info-ua').textContent = navigator.userAgent;
        document.getElementById('js-screen-size').textContent = `${window.screen.width} x ${window.screen.height}`;
        document.getElementById('js-language').textContent = navigator.language;
        document.getElementById('js-date').textContent = new Date().toLocaleString();
    </script>

</body>
</html>
